# NEEDS THE OWNER'S SIGN-OFF BEFORE MERGE. This workflow
#   - runs on a weekly schedule (and on manual dispatch),
#   - reads the repository secret VOYAGE_API_KEY in the online job (paid provider calls),
#   - pushes results to a `bench-results` branch with `contents: write`.
# Create the secret and approve the branch first. Do not dispatch it from a
# development session. The online job runs only after the offline job succeeds,
# and only once benchmarks/bench-v1.toml exists (it is generated by
# benchmarks/curate_bench_v1.py, see docs/performance.md); until then it skips
# its suites with a notice. Only results of successful jobs are published.
name: Benchmarks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  offline:
    name: Offline suites
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      TYCHORA_BENCH_RUNNER_CLASS: github-ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked stack
        run: uv sync --locked --all-extras --group dev
      - name: Ingest suite
        run: uv run --locked python -m tychora.interfaces.bench run --corpus bench-small --suite ingest --profile offline --cache "$RUNNER_TEMP/bench"
      - name: Query suite
        run: uv run --locked python -m tychora.interfaces.bench run --corpus bench-small --suite query --profile offline --cache "$RUNNER_TEMP/bench"
      - name: Scale suite
        run: uv run --locked python -m tychora.interfaces.bench run --corpus bench-small --suite scale --profile offline --checkpoints 100,1000,10000 --max-wall-seconds 14400 --cache "$RUNNER_TEMP/bench"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-offline
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 7

  online:
    name: Online suites
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    # Default success() condition: no paid call after a failed offline run.
    needs: offline
    permissions:
      contents: read
    env:
      TYCHORA_BENCH_RUNNER_CLASS: github-ubuntu-22.04
    outputs:
      ran: ${{ steps.corpus.outputs.present }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check for the bench-v1 corpus
        id: corpus
        run: |
          if [ -f benchmarks/bench-v1.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Online suites skipped::benchmarks/bench-v1.toml is absent; run benchmarks/curate_bench_v1.py and commit it to enable the online suites."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.corpus.outputs.present == 'true'
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked stack
        if: steps.corpus.outputs.present == 'true'
        run: uv sync --locked --all-extras --group dev
      - name: Provision pinned public test assets
        if: steps.corpus.outputs.present == 'true'
        run: python packaging/provision_ci_assets.py --cache "$RUNNER_TEMP/tychora-public-models" --workspace "$RUNNER_TEMP/tychora-asset-setup" --github-env "$GITHUB_ENV"
      - name: Fetch bench-v1
        if: steps.corpus.outputs.present == 'true'
        run: uv run --locked python -m tychora.interfaces.bench fetch --corpus bench-v1 --cache "$RUNNER_TEMP/bench"
      - name: Online query suite
        if: steps.corpus.outputs.present == 'true'
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: uv run --locked python -m tychora.interfaces.bench run --corpus bench-v1 --suite query --profile online --cache "$RUNNER_TEMP/bench"
      - name: Online ingest suite
        if: steps.corpus.outputs.present == 'true'
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: uv run --locked python -m tychora.interfaces.bench run --corpus bench-v1 --suite ingest --profile online --cache "$RUNNER_TEMP/bench"
      - name: Keep the results
        if: always() && steps.corpus.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-online
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to the bench-results branch
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [offline, online]
    # Results of a failed suite job are never published; a failed online job
    # still lets the successful offline results through.
    if: always() && !cancelled() && needs.offline.result == 'success'
    # The only job with write access; it runs no repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-results-offline
          path: ${{ runner.temp }}/incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.online.result == 'success' && needs.online.outputs.ran == 'true'
        with:
          name: bench-results-online
          path: ${{ runner.temp }}/incoming
      - name: Commit the results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "tychora-bench"
          git config user.email "tychora-bench@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch "$remote" bench-results:bench-results; then
            git worktree add "$RUNNER_TEMP/results" bench-results
          else
            git worktree add --detach "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" checkout --orphan bench-results
            git -C "$RUNNER_TEMP/results" rm -rf --quiet .
          fi
          if [ -d "$RUNNER_TEMP/incoming" ]; then
            cp -R "$RUNNER_TEMP/incoming/." "$RUNNER_TEMP/results/"
          fi
          cd "$RUNNER_TEMP/results"
          git add .
          git commit -m "bench: results for ${GITHUB_SHA}" || exit 0
          git push "$remote" bench-results
