name: Standalone executable qualification

# Every pull request builds the onedir executable and runs its frozen smoke tests
# (about 8 minutes). The onefile build and acceptance (40 minutes on Linux) runs on
# main, tags, the nightly schedule, manual dispatch, and pull requests that change
# packaging inputs; see the "Select the onefile build" step.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Caches are off on tag refs (the expression below; zizmor cannot evaluate it),
      # this workflow publishes nothing, and every model file is SHA-256 verified.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 # zizmor: ignore[cache-poisoning]
        with:
          version: "0.9.28"
          # A tag build may become a release: it starts from no cache.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Record native target and lock
        shell: bash
        run: |
          uname -a
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers
            test "$(uname -m)" = arm64
          else
            ldd --version
            test "$(uname -m)" = x86_64
          fi
          uv lock --check
      - name: Select the onefile build
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          onefile=true
          if [[ "$EVENT" == pull_request ]]; then
            # Packaging inputs: the spec, hooks and frozen entry point under packaging/,
            # the dependency set, this workflow, and the console entry point.
            # A diff that cannot be computed keeps the onefile build.
            if changed=$(git diff --name-only "$BASE...$HEAD") && ! grep -Eq '^(packaging/|pyproject\.toml$|uv\.lock$|\.github/workflows/binary\.yml$|src/tychora/interfaces/cli\.py$|src/tychora/__main__\.py$)' <<<"$changed"; then
              onefile=false
            fi
          fi
          echo "onefile=$onefile" | tee -a "$GITHUB_OUTPUT"
      - name: Bootstrap asset provisioning runtime
        run: uv sync --locked --all-extras --no-default-groups
      - name: Restore pinned public models
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3 # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/tychora-public-models
          key: public-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tychora/resources/model-assets.json') }}
      - name: Provision pinned public parser assets
        env:
          UV_NO_SYNC: "1"
        run: python packaging/provision_ci_assets.py --cache "$RUNNER_TEMP/tychora-public-models" --workspace "$RUNNER_TEMP/tychora-asset-setup" --github-env "$GITHUB_ENV"
      - name: Build and inspect staged release wheel on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build_public_stage.py --repository . --source "$RUNNER_TEMP/tychora-public-stage" --dist "$RUNNER_TEMP/tychora-built" --proof "$RUNNER_TEMP/tychora-build-proof.json" --private "$RUNNER_TEMP/tychora-private-fixture" --uv "$(command -v uv)"
          mkdir -p dist
          cp "$RUNNER_TEMP/tychora-built"/*.whl "$RUNNER_TEMP/tychora-built"/*.tar.gz dist/
      - name: Build release wheel on Linux
        if: runner.os == 'Linux'
        run: uv build --offline --out-dir dist
      - name: Audit wheel and source archive
        shell: bash
        run: python packaging/check_artifact.py dist/*.whl dist/*.tar.gz
      - name: Install locked full runtime and accepted wheel
        shell: bash
        run: |
          uv sync --locked --all-extras --group build --no-default-groups --no-install-project
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          UV_NO_SYNC=1 uv run --locked python -c 'import pathlib, tychora; p=pathlib.Path(tychora.__file__).resolve(); assert "site-packages" in p.parts, p; print(p)'
      - name: Produce feature and license payloads
        shell: bash
        run: |
          uv venv .release-base --python 3.12
          uv export --locked --no-default-groups --no-emit-project > .release-base/requirements.txt
          uv pip install --python .release-base/bin/python --no-build --require-hashes -r .release-base/requirements.txt
          uv pip install --python .release-base/bin/python --no-deps dist/*.whl
          source_root="$GITHUB_WORKSPACE"
          if [[ "$RUNNER_OS" == "macOS" ]]; then source_root="$RUNNER_TEMP/tychora-public-stage"; fi
          UV_NO_SYNC=1 uv run --locked python packaging/build_manifest.py --wheel dist/*.whl --sdist dist/*.tar.gz --lock uv.lock --project pyproject.toml --base-python .release-base/bin/python --full-python .venv/bin/python --repository . --source-root "$source_root" --commit "$GITHUB_SHA" --output dist/release-manifest.json
          UV_NO_SYNC=1 uv run --locked python packaging/build_release_features.py --manifest dist/release-manifest.json --output packaging/release-features.json
          UV_NO_SYNC=1 uv run --locked python packaging/build_notices.py --output dist/tychora-notices
      - name: Diagnose native dependencies with onedir
        shell: bash
        run: |
          TYCHORA_BUILD_MODE=onedir UV_NO_SYNC=1 uv run --locked pyinstaller packaging/tychora.spec --noconfirm --clean
          UV_NO_SYNC=1 uv run --locked python packaging/test_frozen.py --artifact dist/tychora-onedir/tychora --features packaging/release-features.json
      - name: Build and accept final onefile executable
        if: steps.scope.outputs.onefile == 'true'
        shell: bash
        run: |
          TYCHORA_BUILD_MODE=onefile UV_NO_SYNC=1 uv run --locked pyinstaller packaging/tychora.spec --noconfirm --clean
          UV_NO_SYNC=1 uv run --locked python packaging/test_frozen.py --artifact dist/tychora --features packaging/release-features.json
          UV_NO_SYNC=1 uv run --locked python packaging/audit_frozen.py --artifact dist/tychora --notices dist/tychora-notices
      - name: Record target artifact checksum
        if: steps.scope.outputs.onefile == 'true'
        shell: bash
        run: |
          version=$(UV_NO_SYNC=1 uv run --locked python -c 'import importlib.metadata; print(importlib.metadata.version("tychora"))')
          cp dist/tychora "dist/tychora-${version}-${{ matrix.target }}"
          shasum -a 256 "dist/tychora-${version}-${{ matrix.target }}" dist/tychora-notices/manifest.json packaging/release-features.json
      - name: Measure final target executable
        if: steps.scope.outputs.onefile == 'true'
        shell: bash
        run: |
          UV_NO_SYNC=1 uv run --locked python packaging/measure_frozen.py --artifact dist/tychora --target "${{ matrix.target }}" --output "$RUNNER_TEMP/tychora-${{ matrix.target }}-measurements.json"
          cat "$RUNNER_TEMP/tychora-${{ matrix.target }}-measurements.json"
          {
            echo "### ${{ matrix.target }} onefile measurements"
            echo '```json'
            cat "$RUNNER_TEMP/tychora-${{ matrix.target }}-measurements.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
