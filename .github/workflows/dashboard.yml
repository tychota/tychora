name: Dashboard delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
      - name: Install locked offline browser server dependencies
        run: uv sync --locked --extra server --extra documents --group dev --group build --group test-fixtures
      - name: Install frontend without lifecycle scripts
        working-directory: dashboard
        run: npm ci --ignore-scripts
      - name: Frontend tests and types
        working-directory: dashboard
        run: npm test && npm run typecheck
      - name: Rebuild committed resources and reject drift
        working-directory: dashboard
        run: npm run check:build
      - name: Install pinned Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Real offline browser journeys
        working-directory: dashboard
        env:
          TYCHORA_E2E_PYTHON: ../.venv/bin/python
        run: npm run e2e
      - name: Verify bounded fixture controls and distribution resources
        run: uv run --locked --extra server --extra documents --group test-fixtures pytest dashboard/e2e/test_server.py tests/transports/test_dashboard_distribution.py -q
