[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "tychora"
version = "0.1.0a1"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2,<3", "typer", "rich", "markdown-it-py", "jsonschema", "platformdirs", "filelock", "tiktoken", "anyio"]

[project.optional-dependencies]
documents = ["docling", "pillow", "pypdf==6.19.0"]
code = ["tree-sitter", "tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript", "pathspec"]
vector = ["chromadb==1.5.9"]
graph = ["ladybug==0.20.3"]
voyage = ["voyageai==0.5.0", "httpx"]
vision = ["anthropic"]
server = ["fastapi", "uvicorn", "httpx", "mcp==2.2.0"]
full = [
  "docling",
  "pillow",
  "pypdf==6.19.0",
  "tree-sitter",
  "tree-sitter-python",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "pathspec",
  "chromadb==1.5.9",
  "ladybug==0.20.3",
  "voyageai==0.5.0",
  "anthropic",
  "fastapi",
  "uvicorn",
  "httpx",
  "mcp==2.2.0",
]

[project.scripts]
tychora = "tychora.interfaces.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "ty"]
build = ["hatchling==1.32.4", "pyinstaller"]
test-fixtures = ["reportlab", "python-docx"]
audit = ["pip-audit", "pip-licenses"]

[tool.hatch.build.targets.wheel]
only-include = ["src/tychora"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
  ".gitignore",
  "src/tychora",
  "tests",
  "packaging",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = ["qualification: real local adapters", "live: explicitly authorized remote synthetic inputs", "release: installed artifact"]
