name: Health nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: Record the nightly metrics in quality/baseline.json and upload it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  suite:
    name: Branch coverage, three seeds and the code gold set
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked stack
        run: uv sync --locked --all-extras --group dev --group test-fixtures
      - name: Restore pinned public models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/tychora-public-models
          key: public-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tychora/resources/model-assets.json') }}
      - name: Provision pinned public test assets and the code corpus
        run: python packaging/provision_ci_assets.py --cache "$RUNNER_TEMP/tychora-public-models" --workspace "$RUNNER_TEMP/tychora-asset-setup" --github-env "$GITHUB_ENV" --code-corpus "$RUNNER_TEMP/tychora-code-corpus"
      - name: Seed 1 with branch coverage and the gold-set report
        env:
          TYCHORA_TEST_TIMEOUT_FACTOR: "3"
          TYCHORA_CODE_GOLD_REPORT: reports/code-gold.json
        run: >-
          uv run --locked pytest tests -q -n auto --randomly-seed=1
          -m 'not live and not qualification and not release and not scale'
          --cov --cov-branch --cov-report=json:reports/coverage-branch.json --cov-report=term
          --junitxml=reports/seed-1.xml
      - name: Seed 2
        if: always()
        env:
          TYCHORA_TEST_TIMEOUT_FACTOR: "3"
        run: uv run --locked pytest tests -q -n auto --randomly-seed=2 -m 'not live and not qualification and not release and not scale' --junitxml=reports/seed-2.xml
      - name: Seed 3
        if: always()
        env:
          TYCHORA_TEST_TIMEOUT_FACTOR: "3"
        run: uv run --locked pytest tests -q -n auto --randomly-seed=3 -m 'not live and not qualification and not release and not scale' --junitxml=reports/seed-3.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-suite-reports
          path: reports/
          retention-days: 14

  isolation:
    name: Clean machine, each listed test file alone
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked stack
        run: uv sync --locked --all-extras --group dev --group test-fixtures
      # Moved from the pull-request clean-machine job: it re-runs files the default
      # suite already ran, to prove no fixture is inherited from another module.
      - name: Each listed test file alone
        run: env -i PATH="$PATH" HOME="$HOME" uv run --locked python -m tools.health isolate

  mutation:
    name: Mutation testing of ${{ matrix.module }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    # One shard per `only_mutate` module of pyproject.toml: a single runner could not
    # finish all ~4100 mutants in 300 minutes. A shard that runs out of time keeps its
    # unchecked mutants as "not checked", which the G21 score excludes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: contracts-identity, module: tychora.contracts.identity}
          - {shard: contracts-publication, module: tychora.contracts.publication}
          - {shard: sqlite-publication, module: tychora.adapters.sqlite.publication}
          - {shard: retrieval-compiler, module: tychora.retrieval.compiler}
          - {shard: retrieval-selection, module: tychora.retrieval.selection}
          - {shard: retrieval-lexical-query, module: tychora.retrieval.lexical_query}
          - {shard: sqlite-lexical, module: tychora.adapters.sqlite.lexical}
          - {shard: retrieval-fusion, module: tychora.retrieval.fusion}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install the project to provision assets
        run: uv sync --locked --all-extras --group test-fixtures
      - name: Restore pinned public models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/tychora-public-models
          key: public-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/tychora/resources/model-assets.json') }}
      - name: Provision pinned public test assets
        run: python packaging/provision_ci_assets.py --cache "$RUNNER_TEMP/tychora-public-models" --workspace "$RUNNER_TEMP/tychora-asset-setup" --github-env "$GITHUB_ENV"
      - name: Reinstall without the project so mutants are imported
        run: uv sync --locked --no-install-project --all-extras --group dev --group mutation --group test-fixtures
      - name: Run mutmut
        # Stops before the job timeout so the export and upload steps still run.
        timeout-minutes: 130
        env:
          MUTANT_PATTERN: ${{ matrix.module }}.*
        run: uv run --no-sync mutmut run "$MUTANT_PATTERN" --max-children 4
      - name: Export this shard's results
        if: always()
        env:
          MODULE: ${{ matrix.module }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p reports
          # `results` lists every mutant of every module; keep only this shard's own.
          uv run --no-sync mutmut results --all true | { grep -F -- "    ${MODULE}." || true; } > "reports/mutmut-results-${SHARD}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-mutation-reports-${{ matrix.shard }}
          path: reports/mutmut-results-${{ matrix.shard }}.txt
          retention-days: 14

  report:
    name: Nightly gates, flakes and architecture report
    needs: [suite, mutation]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install locked checks
        run: uv sync --locked --all-extras --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-suite-reports
          path: reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-mutation-reports-*
          path: reports
          merge-multiple: true
      # Mutant names are unique per module, so the shards never overlap; sort -u
      # keeps a repeated line from being counted twice anyway.
      - name: Merge the mutation shards
        if: always()
        run: |
          mkdir -p reports
          shopt -s nullglob
          cat /dev/null reports/mutmut-results-*.txt | sort -u > reports/mutmut-results.txt
      # G18 measures the session time of reports/junit.xml: seed 2, the run without
      # coverage, over the nightly selection.
      - name: Runtime report for G18
        if: always()
        run: cp reports/seed-2.xml reports/junit.xml
      - name: Architecture report
        run: uv run --locked python -m tools.health report --architecture reports/architecture.md --previous docs/quality/2026-10-15-baseline.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architecture-report
          path: reports/architecture.*
          retention-days: 90
      - name: Tests whose outcome depends on the seed
        if: always()
        run: uv run --locked python -m tools.health flaky reports/seed-1.xml reports/seed-2.xml reports/seed-3.xml
      - name: Record the nightly baseline (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.baseline
        # --initial adds only the metrics missing from quality/baseline.json and keeps existing entries.
        run: uv run --locked python -m tools.health update --initial --group nightly --gates G16,G18,G21,G22
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' && inputs.baseline
        with:
          name: nightly-baseline
          path: quality/baseline.json
          retention-days: 7
      - name: Nightly gates
        if: always()
        run: uv run --locked python -m tools.health check --group nightly --gates G16,G18,G21,G22
