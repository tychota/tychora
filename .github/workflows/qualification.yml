name: Native qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    name: Python 3.12 / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS 15 arm64
            runner: macos-15
          - target: Ubuntu 22.04 x86_64 (glibc 2.35)
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Record native platform
        shell: bash
        run: |
          uname -a
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers
            test "$(uname -m)" = arm64
          else
            ldd --version
            test "$(uname -m)" = x86_64
          fi
      - name: Install locked full environment
        run: uv sync --locked --all-extras --group test-fixtures
      - name: Provision pinned public test assets
        run: python packaging/provision_ci_assets.py --cache "$RUNNER_TEMP/tychora-public-models" --workspace "$RUNNER_TEMP/tychora-asset-setup" --github-env "$GITHUB_ENV"
      - name: Record Python, SQLite, package versions, and installed wheel tags
        shell: bash
        run: |
          uv run python --version
          uv run python -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          uv pip list
          for wheel in .venv/lib/python3.12/site-packages/{chromadb,ladybug,tree_sitter,tree_sitter_python,tree_sitter_typescript,tree_sitter_javascript}-*.dist-info/WHEEL; do
            echo "$wheel"
            grep '^Tag:' "$wheel"
          done
      - name: Run native and SDK qualification gates
        run: uv run --locked --all-extras --group test-fixtures pytest -m qualification tests/qualification -q
      - name: Verify minimal base installation
        shell: bash
        run: |
          uv sync --locked --no-default-groups
          uv run --locked --no-default-groups python -c 'import tychora; print(tychora.__version__)'
